version: 2
# Disable routine version-update PRs and group security updates per directory.
# The schedule is required by Dependabot; security updates are event-driven.
updates:
  - package-ecosystem: npm
    directory: /chatbot-app/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      mobile-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /telegram-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      telegram-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /chatbot-app/agentcore
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
